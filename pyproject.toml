[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polkupy"
version = "0.1.0"
description = "A python package to analyse and visualise personal cycling activities"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Liam Megill", email = "liam@megill.eu" }]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "gpxpy",
    "matplotlib",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pandas-stubs",
    "pytest",
    "readme_renderer[md]",
    "ruff",
    "twine",
]
nb = [
    "notebook"
]
docs = [
    "sphinx",
    "furo"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["polkupy", "polkupy.*"]

[tool.setuptools.package-data]
polkupy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# matplotlib's stubs are incomplete for several plotting methods
reportUnknownMemberType = false

# -- pixi setup ---------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev", "nb", "docs"], solve-group = "default" }

# default environment
[tool.pixi.pypi-dependencies]
polkupy = { path = ".", editable = true }

# dev environment
[tool.pixi.feature.dev.pypi-dependencies]
polkupy = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.feature.dev.tasks]
test = "pytest"
typecheck = "mypy src tests"
lint = "ruff check"
lint-fix = "ruff check --fix"
format-check = "ruff format src tests --check"
format = "ruff format src tests"
full-check = { depends-on = ["typecheck", "lint-fix", "format"] }
build-sdist = "python -m build"
twine-check = "twine check dist/*"
build = { depends-on = ["build-sdist", "twine-check"] }

# nb environment
[tool.pixi.feature.nb.pypi-dependencies]
polkupy = { path = ".", editable = true, extras = ["nb"] }

# docs environment
[tool.pixi.feature.docs.pypi-dependencies]
polkupy = { path = ".", editable = true, extras = ["docs"] }

[tool.pixi.feature.docs.tasks]
docs-build = "sphinx-build -b html docs docs/_build/html"
docs-clean = "rm -rf docs/_build"


# -- ruff configuration -------------------------------------------------------

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "D",      # pydocstyle
    "C90",    # mccabe complexity
    "C4",     # flake8-comprehensions
    "PL",     # pylint
    "S",      # flake8-bandit (dodgy-equivalent)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "PERF",   # perflint
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is idiomatic in pytest
    "D102",    # test method names are self-documenting
    "PLR2004", # magic values are normal in test assertions
]

[tool.ruff.format]
# black-compatible by default, no overrides needed here yet.

# -- mypy configuration -------------------------------------------------------

[tool.mypy]
ignore_missing_imports = true
